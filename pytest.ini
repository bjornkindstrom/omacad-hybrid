[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning
markers =
    ui: tests that instantiate Qt widgets, dialogs or Viewport3D
    model: pure geometry, kernel and document model tests
    slow: long-running boolean or rendering benchmark tests
    hybrid: tests verifying Rust / PyO3 accelerator parity
    desktop: tests requiring an active desktop display (e.g. real GL framebuffer grab)
