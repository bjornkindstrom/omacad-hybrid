mode = "light"

# Omacad Studio Glass: Studio Soft with see-through cards floating over the 3D view (design/ui-soft-proposals, proposal 2).
# The window shares the view's colour, so the ribbon and the panels read as cards floating over one backdrop.
font = "Noto Sans"
soft = true
radius = 16
glass = 0.74
accent = "#3A6FF0"
selection = "#EAF1FF"
muted = "#6A778B"

# surfaces by role (see theme.Palette._studio_neutral)
window = "#E6EBF1"
surface = "#FFFFFF"
field = "#F3F5F9"
border = "#E4E9F0"

background = "#FFFFFF"
dark_background = "#F3F5F9"
darker_background = "#E6EBF1"
lighter_background = "#E4E9F0"

canvas = "#E6EBF1"
grid = "#BCC6D3"
highlight = "#1D4ED8"

foreground = "#233044"
dark_foreground = "#6A778B"
light_foreground = "#233044"
bright_foreground = "#101828"

red = "#C62828"
yellow = "#B45309"
green = "#2E7D4F"
cyan = "#0E7490"
blue = "#3A6FF0"
magenta = "#7E22CE"

bright_red = "#DC2626"
bright_yellow = "#D97706"
bright_green = "#16A34A"
bright_cyan = "#0891B2"
bright_blue = "#3B82F6"
bright_magenta = "#9333EA"
