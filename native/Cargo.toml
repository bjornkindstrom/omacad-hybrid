[package]
name = "omacad-viewport-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "_viewport_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "=0.30.1"

[profile.release]
lto = "thin"
codegen-units = 1
