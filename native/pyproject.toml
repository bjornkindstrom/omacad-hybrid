[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "omacad-viewport-native"
version = "0.1.0"
requires-python = ">=3.10"
description = "Optional Rust BVH accelerator for Omacad Hybrid viewport picking"

[tool.maturin]
module-name = "_viewport_native"
features = ["extension-module"]
